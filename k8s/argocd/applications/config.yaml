apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: o11y
  source:
    repoURL: https://github.com/z63d/minimum-trocco-alpha.git
    targetRevision: HEAD
    path: k8s/config
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
