apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/z63d/minimum-trocco-alpha.git
    targetRevision: HEAD
    path: k8s/argocd/applications
    directory:
      recurse: true
  # 子 Application マニフェスト自体は auto-sync (UI 操作不要で表示される)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
