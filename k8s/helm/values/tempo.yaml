tempo:
  reportingEnabled: false
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo
        endpoint: minio.o11y.svc:9000
        access_key: minioadmin
        secret_key: minioadmin
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/traces

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir-gateway.o11y.svc/api/v1/push
    processor:
      service_graphs: {}
      span_metrics: {}
      local_blocks: {}
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces

  # テナント単位で metrics-generator のプロセッサを有効化しないと
  # trace は受信しても service_graph / span_metrics が生成されない。
  # grafana/tempo (single binary) chart の正しい key は tempo.overrides.defaults。
  # tempo-distributed chart の global_overrides とは異なるので注意。
  #
  # processor 別の役割:
  # - service-graphs : trace を解析して edge metric を Mimir に push
  # - span-metrics   : RED metric (rate/error/duration) を Mimir に push
  # - local-blocks   : 直近 trace を Tempo 内にローカル保持し TraceQL metrics クエリに応答 (Grafana Traces Drilldown が必要とする)
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks

service:
  type: ClusterIP

persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
