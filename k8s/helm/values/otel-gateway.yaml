mode: deployment
replicaCount: 2
fullnameOverride: otel-gateway

image:
  repository: otel/opentelemetry-collector-contrib

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: otel-gateway

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
    filter/healthz:
      error_mode: ignore
      traces:
        span:
          - 'attributes["url.path"] == "/healthz"'

  exporters:
    # traces: traceID consistent hashing → 同一 trace を同じ backend pod へ
    loadbalancing:
      resolver:
        dns:
          hostname: otel-collector-headless.o11y.svc.cluster.local
          interval: 5s
          timeout: 1s
      protocol:
        otlp:
          tls:
            insecure: true
    # metrics: backend ClusterIP 経由 (接続レベル LB で十分)
    otlp/collector:
      endpoint: otel-collector.o11y.svc:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/healthz]
        exporters: [loadbalancing]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter]
        exporters: [otlp/collector]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
