deploymentMode: SingleBinary

minio:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.o11y.svc:9000
      accessKeyId: ${accessKeyId}
      secretAccessKey: ${secretAccessKey}
      insecure: true
      s3ForcePathStyle: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ingester:
    chunk_idle_period: 1m
    max_chunk_age: 2m
    flush_check_period: 30s

singleBinary:
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: minio-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: false
  lokiCanary:
    enabled: false
test:
  enabled: false
