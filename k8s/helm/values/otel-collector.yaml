mode: deployment
replicaCount: 2
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: otel-collector

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 400

  exporters:
    otlp/tempo:
      endpoint: tempo.o11y.svc:4317
      tls:
        insecure: true
    prometheusremotewrite/mimir:
      endpoint: http://mimir-gateway.o11y.svc/api/v1/push
      add_metric_suffixes: false
      resource_to_telemetry_conversion:
        enabled: true
      tls:
        insecure_skip_verify: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite/mimir]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# gateway の loadbalancing exporter が DNS で全 pod IP を解決できるよう headless Service を追加
extraManifests:
  - apiVersion: v1
    kind: Service
    metadata:
      name: otel-collector-headless
      namespace: o11y
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: otel-collector
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
