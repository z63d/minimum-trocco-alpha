admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: NodePort
  nodePort: 30080

persistence:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

dashboardsConfigMaps:
  mintrcc: "grafana-dashboards"

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: mintrcc
        orgId: 1
        folder: "mintrcc"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/mintrcc

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.o11y.svc:3100
        access: proxy
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"([a-f0-9]+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: "View Trace"
      - name: Mimir
        uid: prometheus
        type: prometheus
        url: http://mimir-gateway.o11y.svc/prometheus
        access: proxy
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
              urlDisplayLabel: "View in Tempo"
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.o11y.svc:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            customQuery: false
            tags:
              - key: service.name
                value: service_name
          tracesToMetrics:
            datasourceUid: prometheus
            tags:
              - key: service.name
                value: service_name
            queries:
              - name: "p99 Latency"
                query: 'histogram_quantile(0.99, sum(rate(http_server_request_duration_ms_bucket{$$__tags}[5m])) by (le))'
              - name: "Request Rate"
                query: 'sum(rate(http_server_request_duration_ms_count{$$__tags}[5m]))'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
