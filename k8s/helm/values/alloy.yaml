alloy:
  configMap:
    content: |
      discovery.kubernetes "app_pods" {
        role = "pod"
        namespaces {
          names = ["default"]
        }
      }

      discovery.relabel "app_pods" {
        targets = discovery.kubernetes.app_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["service_name"]
          regex         = ""
          action        = "drop"
        }
      }

      loki.source.kubernetes "app_pods" {
        targets    = discovery.relabel.app_pods.output
        forward_to = [loki.process.parse_json.receiver]
      }

      loki.process "parse_json" {
        forward_to = [loki.write.default.receiver]

        stage.json {
          expressions = {
            level    = "level",
            trace_id = "trace_id",
          }
        }

        stage.labels {
          values = {
            severity = "level",
          }
        }

        stage.structured_metadata {
          values = {
            trace_id = "trace_id",
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.o11y.svc:3100/loki/api/v1/push"
        }
      }

      prometheus.scrape "kube_state_metrics" {
        targets = [{
          __address__ = "kube-state-metrics.o11y.svc:8080",
        }]
        forward_to     = [prometheus.remote_write.mimir.receiver]
        scrape_interval = "30s"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet_cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "kubelet_cadvisor" {
        targets         = discovery.relabel.kubelet_cadvisor.output
        job_name        = "kubelet"
        metrics_path    = "/metrics/cadvisor"
        scheme          = "https"
        scrape_interval = "30s"
        tls_config {
          insecure_skip_verify = true
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        forward_to        = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir-gateway.o11y.svc/api/v1/push"
        }
      }

      loki.source.kubernetes_events "kubernetes_events" {
        namespaces = ["default", "kube-system"]
        forward_to = [loki.write.default.receiver]
      }

rbac:
  create: true
  extraClusterRoleRules:
    # discovery.kubernetes "nodes" で kubelet のエンドポイントを列挙するために必要
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "nodes/metrics"]
      verbs: ["get", "list", "watch"]
    # prometheus.scrape "kubelet_cadvisor" が kubelet の /metrics/cadvisor を直接 HTTP GET するために必要
    # K8s RBAC はリソースだけでなく非リソース URL へのアクセスも制御する
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]

serviceAccount:
  create: true

controller:
  type: daemonset

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
