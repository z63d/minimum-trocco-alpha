global:
  domain: argocd.local

# Argo CD UI を HTTP (insecure) で公開。本番は TLS を有効化する。
configs:
  params:
    server.insecure: true

# 最小構成なので外せるものは外す
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

server:
  service:
    type: NodePort
    nodePortHttp: 30090
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
